name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in agentest"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Example
      description: Provide code or test that demonstrates the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Python version, pytest version, OS (e.g. macOS 15, Ubuntu 24.04, Python 3.12).
      placeholder: "Python 3.12, pytest 8.3, macOS"
    validations:
      required: false
