<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Accent Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="indigoGlow" cx="85%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="876" height="236" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Glows -->
  <rect x="2" y="2" width="876" height="236" rx="16" fill="url(#cyanGlow)" />
  <rect x="2" y="2" width="876" height="236" rx="16" fill="url(#indigoGlow)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="60" x2="880" y2="60" />
    <line x1="0" y1="120" x2="880" y2="120" />
    <line x1="0" y1="180" x2="880" y2="180" />
    <line x1="220" y1="0" x2="220" y2="240" />
    <line x1="440" y1="0" x2="440" y2="240" />
    <line x1="660" y1="0" x2="660" y2="240" />
  </g>

  <!-- Left: Modern Logo Emblem -->
  <g transform="translate(68, 52)" filter="url(#badgeShadow)">
    <!-- Outer Rounded Hex/Box -->
    <rect x="0" y="0" width="136" height="136" rx="30" fill="#0b1329" stroke="url(#logoGrad)" stroke-width="2" />
    
    <!-- Inner Accent Pattern: Interconnected Agent Nodes + Checkmark -->
    <!-- Connection lines -->
    <line x1="38" y1="46" x2="98" y2="46" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
    <line x1="98" y1="46" x2="68" y2="98" stroke="#818cf8" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
    <line x1="68" y1="98" x2="38" y2="46" stroke="#c084fc" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />

    <!-- Node 1: Prompt / Input -->
    <circle cx="38" cy="46" r="8" fill="#38bdf8" />
    <circle cx="38" cy="46" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />

    <!-- Node 2: Tool Execution -->
    <circle cx="98" cy="46" r="8" fill="#818cf8" />
    <circle cx="98" cy="46" r="14" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.4" />

    <!-- Node 3: Assertion / Output -->
    <circle cx="68" cy="98" r="10" fill="#10b981" />
    <circle cx="68" cy="98" r="16" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4" />

    <!-- Center Checkmark inside Node 3 -->
    <path d="M64 98 L67 101 L73 95" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right: Branding & Typography -->
  <g transform="translate(240, 62)">
    <!-- Main Title & Version Pill -->
    <g>
      <text x="0" y="44" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">agentest</text>
      
      <!-- Pill Badge -->
      <g transform="translate(208, 14)">
        <rect x="0" y="0" width="124" height="26" rx="13" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
        <text x="62" y="17" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">PYTEST PLUGIN</text>
      </g>
    </g>

    <!-- Subtitle -->
    <text x="0" y="80" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.2">pytest for AI Agents</text>

    <!-- Tagline -->
    <text x="0" y="108" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="15" font-weight="400">Assert on what your agent did, not just what it said.</text>
  </g>
</svg>
