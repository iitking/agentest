<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Window Container -->
  <rect x="20" y="20" width="840" height="450" rx="14" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Window Header -->
  <rect x="20" y="20" width="840" height="44" rx="14" fill="#0b1120" />
  <rect x="20" y="50" width="840" height="14" fill="#0b1120" />
  <line x1="20" y1="64" x2="860" y2="64" stroke="#1e293b" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="46" cy="42" r="6" fill="#ef4444" />
  <circle cx="66" cy="42" r="6" fill="#f59e0b" />
  <circle cx="86" cy="42" r="6" fill="#10b981" />

  <!-- Window Title -->
  <text x="440" y="46" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="0.5">agentest — pytest examples/test_support_agent.py</text>

  <!-- Terminal Content -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="13" line-height="1.6">
    <!-- Prompt line -->
    <text x="48" y="98" fill="#38bdf8" font-weight="600">❯</text>
    <text x="68" y="98" fill="#f8fafc" font-weight="500">pytest -v examples/test_support_agent.py</text>

    <!-- pytest summary line -->
    <text x="48" y="128" fill="#64748b">============================== test session starts ==============================</text>
    <text x="48" y="148" fill="#94a3b8">platform darwin -- Python 3.12.8, pytest-8.3.4, pluggy-1.5.0</text>
    <text x="48" y="168" fill="#94a3b8">plugins: agentest-0.1.0</text>
    <text x="48" y="188" fill="#94a3b8">collected 2 items</text>

    <!-- Test 1 Execution -->
    <text x="48" y="222" fill="#f8fafc">examples/test_support_agent.py::test_refund_flow</text>
    <text x="730" y="222" fill="#10b981" font-weight="700">PASSED</text>
    <text x="800" y="222" fill="#64748b">[ 50%]</text>

    <!-- Trace output box -->
    <rect x="48" y="238" width="784" height="136" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />

    <text x="64" y="260" fill="#facc15" font-weight="600">⚡ Trace recorded for prompt: <tspan fill="#f8fafc">'I want a refund for order #123'</tspan></text>

    <text x="74" y="284" fill="#64748b">1.</text>
    <text x="96" y="284" fill="#c084fc">llm</text>
    <text x="130" y="284" fill="#94a3b8">gpt-4o</text>
    <text x="210" y="284" fill="#64748b">tokens=300</text>
    <text x="310" y="284" fill="#10b981">cost=$0.0015</text>

    <text x="74" y="306" fill="#64748b">2.</text>
    <text x="96" y="306" fill="#38bdf8" font-weight="600">tool_call</text>
    <text x="174" y="306" fill="#38bdf8">lookup_order</text>
    <text x="265" y="306" fill="#94a3b8">({'order_id': '123'})</text>
    <text x="670" y="306" fill="#10b981">✓ tool_called</text>

    <text x="74" y="328" fill="#64748b">3.</text>
    <text x="96" y="328" fill="#38bdf8" font-weight="600">tool_call</text>
    <text x="174" y="328" fill="#38bdf8">issue_refund</text>
    <text x="265" y="328" fill="#94a3b8">({'order_id': '123', 'amount': 499})</text>
    <text x="670" y="328" fill="#10b981">✓ tool_called</text>

    <text x="74" y="352" fill="#64748b">4.</text>
    <text x="96" y="352" fill="#4ade80">summary</text>
    <text x="174" y="352" fill="#94a3b8">4 steps (max 8) | 550 tokens | $0.0027 (limit $0.05) | latency: 0.62s</text>

    <!-- Test 2 Execution -->
    <text x="48" y="398" fill="#f8fafc">examples/test_support_agent.py::test_mock_tool_is_used</text>
    <text x="730" y="398" fill="#10b981" font-weight="700">PASSED</text>
    <text x="800" y="398" fill="#64748b">[100%]</text>

    <!-- Summary footer -->
    <line x1="48" y1="422" x2="832" y2="422" stroke="#1e293b" stroke-width="1" />
    <text x="48" y="444" fill="#10b981" font-weight="700">============================== 2 passed in 0.88s ==============================</text>
  </g>
</svg>
